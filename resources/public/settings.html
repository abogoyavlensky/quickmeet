<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f5f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111312" media="(prefers-color-scheme: dark)">
  <title data-i18n>Settings · quickmeet</title>
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="stylesheet" href="/static/fonts.css">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/ui.js"></script>
  <script src="/static/i18n.js"></script>
</head>
<body>
  <header class="bar">
    <a id="back" class="back" href="/"></a>
    <a class="brand" href="/">quickmeet</a>
    <nav>
      <a href="/history" data-i18n>History</a>
      <a href="/settings" aria-current="page" data-i18n>Settings</a>
      <button id="signout" class="link" data-i18n>Sign out</button>
    </nav>
  </header>
  <main class="page">
    <h1 data-i18n>Settings</h1>
    <p class="lead"><span data-i18n>Signed in as</span> <span id="email"></span></p>
    <form id="form" class="form">
      <label><span data-i18n>Your name</span> <input id="display-name" maxlength="64" required></label>
      <p class="muted" data-i18n>Shown to the other person in a call.</p>
      <button id="submit" class="primary" type="submit" data-i18n>Save name</button>
      <p id="status" class="notice" hidden data-i18n>Name saved.</p>
      <p id="error" class="error" hidden></p>
    </form>
    <!-- Ringing on this device, on or off. The browser's subscription is
         the state; see push in ui.js. -->
    <section id="ringing" class="form">
      <h2 data-i18n>Notifications</h2>
      <p class="muted" data-i18n>When someone rings you from a call, this device shows it.</p>
      <button id="ring-toggle" hidden></button>
      <p id="ring-status" class="muted" hidden></p>
      <p id="ring-error" class="error" hidden></p>
    </section>
    <!-- The interface's language, the account's: it follows the person to
         every browser they sign in on (i18n.js). The languages' own names
         are not translated. -->
    <section class="form">
      <h2 data-i18n>Language</h2>
      <label><span data-i18n>Language of the interface</span>
        <select id="language">
          <option value="auto" data-i18n>Auto (browser)</option>
          <option value="en">English</option>
          <option value="ru">Русский</option>
        </select>
      </label>
      <p class="muted" data-i18n>Auto follows this browser's language.</p>
      <p id="language-error" class="error" hidden></p>
    </section>
  </main>
  <script>
    const $ = id => document.getElementById(id);
    setIcon($('back'), 'back', t('Back'));

    // Settings are for a signed-in person; anyone else goes to sign in.
    let email = null;
    async function load() {
      const res = await fetch('/api/me');
      if (!res.ok) { rememberLanguage(null); location.href = '/signin'; return; }
      const me = await res.json();
      if (rememberLanguage(me.language)) setIcon($('back'), 'back', t('Back'));
      email = me.email;
      $('language').value = me.language;
      savedLanguage = me.language;
      $('email').textContent = email;
      $('display-name').value = me.display_name;
      try { await push.sync(email); } catch (e) { /* offline: shown as it is */ }
      drawRinging();
    }

    // ---- ringing --------------------------------------------------------

    // One button, by whether this device is subscribed, or one line saying
    // why it cannot be: not installed (iPhone), refused, or unsupported.
    async function drawRinging() {
      const say = text => { $('ring-status').textContent = text; $('ring-status').hidden = false; $('ring-toggle').hidden = true; };
      $('ring-status').hidden = true;
      if (!push.supported()) {
        say(push.needsInstall()
          ? t('To be rung on this iPhone, add quickmeet to your home screen (Share, then Add to Home Screen) and open it from there.')
          : t('This browser cannot receive rings.'));
        return;
      }
      if (Notification.permission === 'denied') {
        say(t("Notifications are blocked for this site in the browser's settings."));
        return;
      }
      const on = !!(await push.subscription().catch(() => null));
      $('ring-toggle').textContent = on ? t('Stop ringing this device') : t('Let people ring me on this device');
      $('ring-toggle').className = on ? '' : 'primary';
      $('ring-toggle').dataset.on = on ? '1' : '';
      $('ring-toggle').hidden = false;
    }

    // Turning on asks for permission first thing (push.on), inside the tap.
    $('ring-toggle').addEventListener('click', async () => {
      $('ring-toggle').disabled = true;
      $('ring-error').hidden = true;
      try {
        if ($('ring-toggle').dataset.on) await push.off();
        else await push.on(email);
      } catch (e) {
        $('ring-error').textContent = String(e.message || e);
        $('ring-error').hidden = false;
      } finally {
        $('ring-toggle').disabled = false;
        await drawRinging();
      }
    });

    // The sentences the API sends ready-made that this page can show, in
    // the page's language; others are shown as the server wrote them.
    const serverSentence = message => ({
      'Enter a name.': t('Enter a name.'),
      'The name must be at most 64 characters.': t('The name must be at most 64 characters.'),
    })[message] || message;

    // ---- language -------------------------------------------------------

    // Saved on change. A failed save says why and puts the select back on
    // what the account has; nothing changes on this device.
    let savedLanguage = 'auto';
    $('language').addEventListener('change', async () => {
      const language = $('language').value;
      $('language').disabled = true;
      $('language-error').hidden = true;
      try {
        const res = await fetch('/api/me', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ language }),
        });
        if (res.status === 401) { location.href = '/signin'; return; }
        if (!res.ok) throw new Error(serverSentence((await res.json()).error));
        savedLanguage = language;
        if (rememberLanguage(language)) {
          setIcon($('back'), 'back', t('Back'));
          $('status').hidden = true;
          $('error').hidden = true;
          await drawRinging();
        }
      } catch (e) {
        $('language').value = savedLanguage;
        $('language-error').textContent = String(e.message || e);
        $('language-error').hidden = false;
      } finally {
        $('language').disabled = false;
      }
    });

    $('form').addEventListener('submit', async event => {
      event.preventDefault();
      $('submit').disabled = true;
      $('status').hidden = true;
      $('error').hidden = true;
      try {
        const res = await fetch('/api/me', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ display_name: $('display-name').value }),
        });
        if (res.status === 401) { location.href = '/signin'; return; }
        if (!res.ok) throw new Error(serverSentence((await res.json()).error));
        const { display_name } = await res.json();
        $('display-name').value = display_name;
        $('status').hidden = false;
      } catch (e) {
        $('error').textContent = String(e.message || e);
        $('error').hidden = false;
      } finally {
        $('submit').disabled = false;
      }
    });

    load();
  </script>
</body>
</html>
