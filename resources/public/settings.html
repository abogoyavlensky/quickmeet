<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f5f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111312" media="(prefers-color-scheme: dark)">
  <title>Settings · quickmeet</title>
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="stylesheet" href="/static/fonts.css">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/ui.js"></script>
</head>
<body>
  <header class="bar">
    <a id="back" class="back" href="/"></a>
    <a class="brand" href="/">quickmeet</a>
    <nav>
      <a href="/history">History</a>
      <a href="/settings" aria-current="page">Settings</a>
      <button id="signout" class="link">Sign out</button>
    </nav>
  </header>
  <main class="page">
    <h1>Settings</h1>
    <p class="lead">Signed in as <span id="email"></span>.</p>
    <form id="form" class="form">
      <label>Your name <input id="display-name" maxlength="64" required></label>
      <p class="muted">Shown to the other person in a call.</p>
      <button id="submit" class="primary" type="submit">Save name</button>
      <p id="status" class="notice" hidden>Name saved.</p>
      <p id="error" class="error" hidden></p>
    </form>
    <!-- Ringing on this device, on or off. The browser's subscription is
         the state; see push in ui.js. -->
    <section id="ringing" class="form">
      <h2>Notifications</h2>
      <p class="muted">When someone rings you from a call, this device shows it.</p>
      <button id="ring-toggle" hidden></button>
      <p id="ring-status" class="muted" hidden></p>
      <p id="ring-error" class="error" hidden></p>
    </section>
  </main>
  <script>
    const $ = id => document.getElementById(id);
    setIcon($('back'), 'back', 'Back');

    // Settings are for a signed-in person; anyone else goes to sign in.
    let email = null;
    async function load() {
      const res = await fetch('/api/me');
      if (!res.ok) { location.href = '/signin'; return; }
      const me = await res.json();
      email = me.email;
      $('email').textContent = email;
      $('display-name').value = me.display_name;
      try { await push.sync(email); } catch (e) { /* offline: shown as it is */ }
      drawRinging();
    }

    // ---- ringing --------------------------------------------------------

    // One button, by whether this device is subscribed, or one line saying
    // why it cannot be: not installed (iPhone), refused, or unsupported.
    async function drawRinging() {
      const say = text => { $('ring-status').textContent = text; $('ring-status').hidden = false; $('ring-toggle').hidden = true; };
      $('ring-status').hidden = true;
      if (!push.supported()) {
        say(push.needsInstall()
          ? 'To be rung on this iPhone, add quickmeet to your home screen (Share, then Add to Home Screen) and open it from there.'
          : 'This browser cannot receive rings.');
        return;
      }
      if (Notification.permission === 'denied') {
        say("Notifications are blocked for this site in the browser's settings.");
        return;
      }
      const on = !!(await push.subscription().catch(() => null));
      $('ring-toggle').textContent = on ? 'Stop ringing this device' : 'Let people ring me on this device';
      $('ring-toggle').className = on ? '' : 'primary';
      $('ring-toggle').dataset.on = on ? '1' : '';
      $('ring-toggle').hidden = false;
    }

    // Turning on asks for permission first thing (push.on), inside the tap.
    $('ring-toggle').addEventListener('click', async () => {
      $('ring-toggle').disabled = true;
      $('ring-error').hidden = true;
      try {
        if ($('ring-toggle').dataset.on) await push.off();
        else await push.on(email);
      } catch (e) {
        $('ring-error').textContent = String(e.message || e);
        $('ring-error').hidden = false;
      } finally {
        $('ring-toggle').disabled = false;
        await drawRinging();
      }
    });

    $('form').addEventListener('submit', async event => {
      event.preventDefault();
      $('submit').disabled = true;
      $('status').hidden = true;
      $('error').hidden = true;
      try {
        const res = await fetch('/api/me', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ display_name: $('display-name').value }),
        });
        if (res.status === 401) { location.href = '/signin'; return; }
        if (!res.ok) throw new Error((await res.json()).error);
        const { display_name } = await res.json();
        $('display-name').value = display_name;
        $('status').hidden = false;
      } catch (e) {
        $('error').textContent = String(e.message || e);
        $('error').hidden = false;
      } finally {
        $('submit').disabled = false;
      }
    });

    load();
  </script>
</body>
</html>
