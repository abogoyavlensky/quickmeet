<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111312">
  <title>quickmeet</title>
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="stylesheet" href="/static/fonts.css">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/livekit-client.umd.min.js"></script>
  <script src="/static/track-processors.js"></script>
  <script src="/static/ui.js"></script>
</head>
<body class="room">
  <!-- Before the call: back to the list, the brand and the link to send.
       In the call: the other person, how long it has been, the same link
       as an icon, and on a desktop the settings: a camera and a
       microphone to pick, in a panel under the bar. -->
  <header class="bar">
    <a id="back" class="back" href="/"></a>
    <a class="brand" href="/">quickmeet</a>
    <span class="who"><span class="dot"></span><span id="remote-name">waiting for the other side…</span><span id="timer"></span></span>
    <span class="end">
      <button id="full" hidden></button>
      <button id="copy" class="ghost" title="Copy link"></button>
      <button id="more" hidden></button>
      <div id="settings" class="panel" hidden>
        <label>Camera <select id="cam-pick"></select></label>
        <label>Microphone <select id="mic-pick"></select></label>
      </div>
    </span>
  </header>

  <!-- The link points at no room: nothing is asked of the camera. -->
  <section id="gone" class="lobby" hidden>
    <h1>This link does not exist.</h1>
    <p class="lead">The call it led to was deleted, or the address is mistyped.</p>
    <p><a class="button" href="/">Start a new call</a></p>
  </section>

  <!-- Before joining: a preview (with the blur button in its corner, so
       the background is hidden before anyone sees it, and the microphone
       and camera buttons at its foot, so either can be off before anyone
       hears or sees it), who is already there, the devices. -->
  <section id="lobby" class="lobby" hidden>
    <div class="preview">
      <video id="preview" autoplay playsinline muted></video>
      <p class="cam-off-label">Camera is off</p>
      <div class="preview-controls">
        <button id="mic-preview" hidden></button>
        <button id="cam-preview" hidden></button>
      </div>
      <button id="blur-preview" hidden></button>
    </div>
    <p id="presence"></p>
    <p id="notice" class="notice" hidden></p>
    <div class="join-row">
      <input id="identity" maxlength="64" placeholder="Your name" aria-label="Your name" autocomplete="name">
      <button id="join" class="primary">Join call</button>
    </div>
    <p id="error" class="error" hidden></p>
    <div class="devices">
      <label>Camera <select id="cam-select"></select></label>
      <label>Microphone <select id="mic-select"></select></label>
    </div>
  </section>

  <section id="call" class="call" hidden>
    <div class="tile empty"><video id="remote" autoplay playsinline></video></div>
    <!-- Your own picture, with the blur button in its corner: blur is set
         once and lives on your picture, as it does in the lobby. -->
    <div class="tile self"><video id="local" autoplay playsinline muted></video><button id="blur" hidden></button></div>
    <!-- One line for the call's state, shown only when something needs
         attention; while alone, Ring for the other members who can be
         rung and the link to send; the sound button for browsers that
         block remote audio until a tap (iOS Safari). -->
    <div class="overlay">
      <p id="status" class="status" hidden></p>
      <button id="ring" class="primary" hidden></button>
      <button id="invite" class="primary"></button>
      <button id="sound" class="primary" hidden>Tap to enable sound</button>
    </div>
    <footer class="controls">
      <button id="mic"></button>
      <button id="cam"></button>
      <button id="switch-cam" hidden></button>
      <button id="share" hidden></button>
      <button id="leave" class="danger"></button>
    </footer>
  </section>

  <script>
    // The page has three states, one section each: #gone (no such room),
    // #lobby (preview, devices, presence, not yet in the call) and #call.
    // The lobby acquires the camera and microphone once; joining publishes
    // those same tracks, so there is one permission prompt. Either can be
    // turned off there, and is then published muted. Leaving, or a
    // dropped connection, returns to the lobby, which starts over (the
    // client stops local tracks on disconnect).
    const { Room, RoomEvent, Track, DisconnectReason, VideoPresets, createLocalTracks } = LivekitClient;
    const $ = id => document.getElementById(id);
    const roomId = location.pathname.split('/').pop();
    const FULL = 'This call already has two people in it.';
    const WAITING = 'Waiting for the other person.';
    const RING_FAILED = 'Could not ring.';
    // A phone or a tablet, by the browser's own word. Such a device has a
    // front and a back camera to flip between, no screen to share, and
    // routes a headset itself, so it gets no settings panel.
    const handheld = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent)
      || !!(navigator.userAgentData && navigator.userAgentData.mobile);

    for (const id of ['copy', 'invite']) {
      $(id).innerHTML = icon('link') + '<span>Copy link</span>';
      $(id).addEventListener('click', () => copyLink($(id), location.href));
    }
    setIcon($('leave'), 'hang', 'Leave');
    setIcon($('back'), 'back', 'Back');

    const showError = e => { $('error').textContent = String(e.message || e); $('error').hidden = false; };
    const showNotice = text => { $('notice').textContent = text || ''; $('notice').hidden = !text; };
    const nameOf = p => p.name || p.identity;
    const show = section => {
      for (const id of ['gone', 'lobby', 'call']) $(id).hidden = id !== section;
      document.body.classList.toggle('in-call', section === 'call');
      if (section !== 'call' && fullScreen()) exitFull.call(document);
      if (section !== 'call') closeSettings();
    };
    // The one line of status, and whether we are alone: alone, the stage is
    // empty and the line sits in its middle with the link to send.
    function setStatus(text, alone) {
      $('status').textContent = text || '';
      $('status').hidden = !text;
      document.body.classList.toggle('waiting', !!alone);
      wake();
    }

    // A failure in the call, said for four seconds in the status line, then
    // the line goes back to what it said, unless something else replaced it.
    function flash(text) {
      setStatus(text);
      setTimeout(() => {
        if (window.call.room && $('status').textContent === text) refreshStatus(window.call.room);
      }, 4000);
    }

    // The whole call state, exposed for tests and for poking at from devtools.
    // `joined` flips once the local tracks are published; `remote` is the
    // other participant's name (what they typed, or their account's display
    // name), not their LiveKit identity; `tracks` holds the subscribed
    // remote tracks so `stats()` can read their inbound RTP counters.
    // `tracks.video` is the one on stage, the screen or the camera. `blur`
    // (defined with the blur logic below) says whether the camera is blurred
    // now; `remoteScreen` whether the stage shows the other side's screen.
    // `ring` lists whom Ring would reach (names), from the token response.
    window.call = { room: null, remote: null, joined: false, ring: [], tracks: { video: null, audio: null } };
    Object.defineProperty(window.call, 'remoteScreen', { get: () => !!remoteVideo.screen });

    // Inbound RTP stats for the remote video and audio: null for a kind that
    // is not subscribed. Video: framesDecoded, packetsReceived, packetsLost;
    // audio: packetsReceived, packetsLost. The e2e suite reads this shape.
    window.call.stats = async () => {
      const inbound = async (track, withFrames) => {
        if (!track) return null;
        const report = await track.getRTCStatsReport();
        if (!report) return null;
        for (const s of report.values()) {
          if (s.type !== 'inbound-rtp') continue;
          const out = { packetsReceived: s.packetsReceived, packetsLost: s.packetsLost };
          if (withFrames) out.framesDecoded = s.framesDecoded;
          return out;
        }
        return null;
      };
      return { video: await inbound(call.tracks.video, true), audio: await inbound(call.tracks.audio, false) };
    };

    // The remote tile takes the shape of the video it shows: `--ratio`
    // (width over height, a number so CSS can multiply it) and `wide` or
    // `tall`. The shape comes from the <video> element, not from LiveKit's
    // track dimensions: the element reports what is actually shown, after
    // the sender rotates their phone or the SFU switches layer, and fires
    // `resize` for both. An empty tile goes back to the default shape.
    //
    // Where the tile is the whole stage instead (immersive, below), `fill`
    // decides between filling it and showing the video whole: filling crops,
    // and is worth it only while it crops little. A phone lying sideways in
    // a browser leaves a strip three times as wide as it is high; filling
    // that with a 4:3 picture would cut half of it away. A shared screen is
    // never cropped: it is text, not a face.
    const CROP_LIMIT = 0.2;
    const remoteTile = $('remote').parentElement;
    // The other side's videos by source, the ones subscribed now (see
    // showRemote below).
    const remoteVideo = { camera: null, screen: null };
    function resetRemote() {
      remoteTile.style.removeProperty('--ratio');
      remoteTile.classList.remove('wide', 'tall', 'fill');
      remoteTile.classList.add('empty');
    }
    function fitRemote() {
      const { videoWidth: w, videoHeight: h } = $('remote');
      if (!w || !h) { resetRemote(); return; }
      remoteTile.style.setProperty('--ratio', w / h);
      remoteTile.classList.remove('empty');
      remoteTile.classList.toggle('wide', w >= h);
      remoteTile.classList.toggle('tall', w < h);
      const box = remoteTile.getBoundingClientRect();
      if (!box.width || !box.height) return;
      const video = w / h, tile = box.width / box.height;
      remoteTile.classList.toggle('fill', !remoteVideo.screen && 1 - Math.min(video / tile, tile / video) <= CROP_LIMIT);
    }
    $('remote').addEventListener('resize', fitRemote);
    $('remote').addEventListener('loadedmetadata', fitRemote);
    // The tile changes size when the window does or the phone is turned.
    new ResizeObserver(fitRemote).observe(remoteTile);

    // The other side can send two videos, their camera and their screen.
    // Both stay subscribed and the stage shows one: the screen while there
    // is one, else the camera. The camera, attached to nothing meanwhile, is
    // paused by the SFU (adaptiveStream), so it costs no bandwidth. `screen`
    // on the tile follows the choice, not the element: fitRemote resets the
    // tile while a new video has no frame yet, and must not lose it then.
    function showRemote() {
      const track = remoteVideo.screen || remoteVideo.camera;
      const shown = window.call.tracks.video;
      if (shown && shown !== track) shown.detach($('remote'));
      if (track && track !== shown) track.attach($('remote'));
      window.call.tracks.video = track;
      remoteTile.classList.toggle('screen', !!remoteVideo.screen);
      if (track) fitRemote(); else resetRemote();
    }
    function clearRemote() {
      remoteVideo.camera = remoteVideo.screen = null;
      showRemote();
    }
    const remoteSlot = pub => (pub.source === Track.Source.ScreenShare ? 'screen' : 'camera');

    // ---- stage ----------------------------------------------------------

    // Immersive: the video is the whole stage and the bar and controls lie
    // over it. That is every phone, and any screen in full screen. iPhones
    // have no full screen for pages, so the button is absent there.
    const small = matchMedia('(max-width: 700px), (max-height: 500px)');
    const root = document.documentElement;
    const enterFull = root.requestFullscreen || root.webkitRequestFullscreen;
    const exitFull = document.exitFullscreen || document.webkitExitFullscreen;
    const fullScreen = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
    function layout() {
      document.body.classList.toggle('immersive', small.matches || fullScreen());
      setIcon($('full'), fullScreen() ? 'shrink' : 'expand', fullScreen() ? 'Leave full screen' : 'Full screen');
      fitRemote();
    }
    small.addEventListener('change', layout);
    for (const ev of ['fullscreenchange', 'webkitfullscreenchange']) document.addEventListener(ev, layout);
    $('full').hidden = !enterFull;
    $('full').addEventListener('click', () => (fullScreen() ? exitFull.call(document) : enterFull.call(root)));

    // Over the video, the bar and the controls fade after a few quiet
    // seconds and come back on any movement, tap or key. They stay while
    // there is something to read (the status line) or we are alone.
    let idleTimer = null;
    function wake() {
      document.body.classList.remove('idle');
      clearTimeout(idleTimer);
      idleTimer = setTimeout(() => {
        const busy = !$('status').hidden || !$('sound').hidden || !$('settings').hidden || document.querySelector('.bar :focus-visible, .controls :focus-visible, .tile.self :focus-visible');
        if (!busy) document.body.classList.add('idle');
      }, 4000);
    }
    // The tap that brings them back is only that: on a touch screen its
    // click lands on whatever is under the finger when it lifts, which by
    // then is a button again. So a press that began on faded controls has
    // its click swallowed.
    let wakingTap = false;
    document.addEventListener('pointerdown', () => {
      wakingTap = document.body.matches('.immersive.idle');
    }, true);
    document.addEventListener('click', event => {
      if (!wakingTap) return;
      wakingTap = false;
      event.stopPropagation();
      event.preventDefault();
    }, true);
    for (const ev of ['pointermove', 'pointerdown', 'keydown']) document.addEventListener(ev, wake);
    layout();

    // How long the other person has been here, next to their name.
    const clock = { since: null, tick: null };
    function drawClock() {
      const s = Math.floor((Date.now() - clock.since) / 1000);
      const pad = n => String(n).padStart(2, '0');
      const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60;
      $('timer').textContent = (h ? h + ':' + pad(m) : m) + ':' + pad(s % 60);
    }
    function startClock() {
      if (clock.since) return;
      clock.since = Date.now();
      drawClock();
      clock.tick = setInterval(drawClock, 1000);
    }
    function stopClock() {
      clearInterval(clock.tick);
      clock.since = null;
      $('timer').textContent = '';
    }

    // ---- lobby ----------------------------------------------------------

    // tracks: the local tracks acquired for the preview, published on join.
    // ready: the promise of acquiring them, awaited by join() so an early
    // click still works. poll: the presence interval while in the lobby.
    // joining: set from the click until the call is up or has failed, so a
    // late presence response or a second click cannot start another join.
    // switching: the promise of turning the microphone or camera off or on,
    // null when there is none; join() waits for it.
    const lobby = { tracks: [], ready: null, poll: null, joining: false, switching: null };
    const trackOfKind = kind => lobby.tracks.find(t => t.kind === kind) || null;
    // The cameras and microphones there are, by Track.Kind ('video',
    // 'audio'), from fillDevices; and the promise of a device switch in
    // flight for each kind, null when there is none (see switchDevice).
    const devices = { video: [], audio: [] };
    const busy = { video: null, audio: null };
    // The settings of the capture itself. With blur on, the track's
    // mediaStreamTrack is the processed one, which says nothing of the
    // device or which way it faces.
    const settingsOf = kind => { const t = trackOfKind(kind); return t ? t.getSourceTrackSettings() : {}; };

    // Every lobby start begins from no tracks: whatever the previous lobby
    // or call held is stopped, so a failed join does not leak a capture
    // stream (the client stops only published tracks on disconnect).
    function stopTracks() {
      for (const t of lobby.tracks) { t.stop(); t.detach(); }
      lobby.tracks = [];
    }

    async function loadRoom() {
      const res = await fetch(`/api/rooms/${roomId}`);
      if (!res.ok) { show('gone'); return; }
      show('lobby');
      startLobby();
      fillName();
    }

    // A signed-in person's display name goes into the name field, unless
    // they typed one already. Guests see the same lobby; nothing waits on
    // this, so a slow answer cannot delay the preview or a join.
    async function fillName() {
      try {
        const res = await fetch('/api/me');
        if (!res.ok) return;
        const { display_name } = await res.json();
        if (!$('identity').value) $('identity').value = display_name;
      } catch (e) { /* a guest, or offline: the field stays empty */ }
    }

    function startLobby(notice) {
      stopTracks();
      clearRemote();
      lobby.joining = false;
      showNotice(notice);
      $('error').hidden = true;
      $('join').disabled = false;
      lobby.switching = null;
      drawMedia();
      drawBlur();
      lobby.ready = acquireTracks().then(fillDevices).then(restoreBlur);
      startPolling();
      window.call.ring = [];
      resetRing();
    }

    // Camera and microphone; failing that, one of them; failing that, join
    // receive-only. Each fallback says so in the lobby.
    async function acquireTracks() {
      const attempts = [
        [{ audio: true, video: { facingMode: 'user' } }, null],
        [{ audio: true }, 'No camera found: joining with audio only.'],
        [{ video: { facingMode: 'user' } }, 'No microphone found: joining without sound.'],
      ];
      for (const [options, note] of attempts) {
        try {
          lobby.tracks = await createLocalTracks(options);
          if (note) showNotice(note);
          const video = trackOfKind(Track.Kind.Video);
          if (video) video.attach($('preview'));
          return;
        } catch (e) { /* the next attempt asks for less */ }
      }
      lobby.tracks = [];
      showNotice('No camera or microphone: you will only see and hear.');
    }

    // Permission was just granted (or refused), so labels are available and
    // no second prompt is needed: getLocalDevices(kind, false).
    // Each kind has two pickers, the lobby's and the call's settings panel;
    // drawDevices keeps them on the device in use.
    const pickers = { video: ['cam-select', 'cam-pick'], audio: ['mic-select', 'mic-pick'] };
    async function fillDevices() {
      const kinds = [[Track.Kind.Video, 'videoinput', 'Camera'], [Track.Kind.Audio, 'audioinput', 'Microphone']];
      for (const [kind, deviceKind, fallback] of kinds) {
        devices[kind] = await Room.getLocalDevices(deviceKind, false);
        for (const id of pickers[kind]) {
          const select = $(id);
          select.innerHTML = '';
          devices[kind].forEach((d, i) => {
            const option = document.createElement('option');
            option.value = d.deviceId;
            option.textContent = d.label || `${fallback} ${i + 1}`;
            select.append(option);
          });
        }
      }
      drawMedia();
    }
    for (const [kind, ids] of Object.entries(pickers)) {
      for (const id of ids) $(id).addEventListener('change', e => switchDevice(kind, { deviceId: { exact: e.target.value } }));
    }
    // A camera or a microphone plugged in or out, in the lobby or the call.
    if (navigator.mediaDevices) {
      navigator.mediaDevices.addEventListener('devicechange', () => { if (lobby.tracks.length) fillDevices(); });
    }

    // Switching the device of a track, from a picker or the switch-camera
    // button. restartTrack stops the capture, asks for the new one, and
    // swaps it into the published sender and every element the track is
    // attached to, blur and all, so the other side gets it with no
    // republish. It asks getUserMedia for the device alone and applies the
    // rest afterwards, so a camera is asked for its 720p again here.
    //
    // The old capture is stopped before the new one is asked for, so a
    // device that cannot start leaves the track dead: it is restarted on
    // the device it had, and the person is told. One thing at a time works
    // on a track, as with the mute switches and blur, and nothing switches
    // while a join publishes. If the lobby started over meanwhile (a leave,
    // a lost connection), the track is nobody's any more: it is not
    // restarted again but stopped, so no camera is left running.
    const SWITCH_FAILED = { video: 'Could not switch camera.', audio: 'Could not switch microphone.' };
    async function switchDevice(kind, options) {
      const track = trackOfKind(kind);
      const publishing = lobby.joining && !window.call.joined;
      if (!track || busy[kind] || lobby.switching || publishing || track.isMuted
          || (kind === Track.Kind.Video && blurBusy)) {
        drawDevices();
        return false;
      }
      const before = settingsOf(kind).deviceId;
      const extra = kind === Track.Kind.Video ? { resolution: VideoPresets.h720.resolution } : {};
      busy[kind] = (async () => {
        let ok = true;
        try {
          await track.restartTrack({ ...options, ...extra });
        } catch (e) {
          ok = false;
          if (track === trackOfKind(kind)) {
            await track.restartTrack({ deviceId: before ? { exact: before } : undefined, ...extra }).catch(() => {});
          }
        }
        if (track !== trackOfKind(kind)) { track.stop(); return false; }
        return ok;
      })();
      drawMedia();
      drawBlur();
      const ok = await busy[kind];
      busy[kind] = null;
      drawMedia();
      drawBlur();
      if (!ok && track === trackOfKind(kind)) {
        if (window.call.joined) flash(SWITCH_FAILED[kind]); else showError(SWITCH_FAILED[kind]);
      }
      return ok;
    }

    // The switch-camera button, in the call's controls while there is more
    // than one camera: a phone flips between its front and back cameras by
    // facing (an iPhone lists several back cameras, and going through them
    // in turn is not a flip); a desktop moves to its next camera. The
    // settings panel is where a desktop picks one exactly.
    $('switch-cam').addEventListener('click', () => {
      const current = settingsOf(Track.Kind.Video);
      if (handheld) {
        const side = current.facingMode === 'environment' ? 'user' : 'environment';
        switchDevice(Track.Kind.Video, { facingMode: { exact: side } });
        return;
      }
      const list = devices.video;
      const next = list[(list.findIndex(d => d.deviceId === current.deviceId) + 1) % list.length];
      if (next) switchDevice(Track.Kind.Video, { deviceId: { exact: next.deviceId } });
    });

    // Everything about the devices that follows their state: the switch
    // button, the mirror, and the four pickers (which device, and whether
    // they wait). Called from drawMedia, so wherever the lobby's buttons
    // are drawn, and from showMic and showCam in the call.
    function drawDevices() {
      const publishing = lobby.joining && !window.call.joined;
      for (const kind of [Track.Kind.Video, Track.Kind.Audio]) {
        const track = trackOfKind(kind), current = settingsOf(kind).deviceId;
        const waits = !track || track.isMuted || !!lobby.switching || !!busy[kind] || publishing
          || (kind === Track.Kind.Video && !!blurBusy);
        for (const id of pickers[kind]) {
          const select = $(id);
          if (current && [...select.options].some(o => o.value === current)) select.value = current;
          select.disabled = select.options.length === 0 || waits;
        }
      }
      const cam = camTrack(), flip = $('switch-cam');
      flip.hidden = !cam || devices.video.length < 2;
      flip.disabled = !cam || cam.isMuted || !!busy.video || !!blurBusy || !!lobby.switching || publishing;
      setIcon(flip, 'flip', handheld ? 'Flip camera' : 'Switch camera');
      document.body.classList.toggle('rear-camera', settingsOf(Track.Kind.Video).facingMode === 'environment');
      if (window.call.joined) {
        $('mic').disabled = !!busy.audio;
        $('cam').disabled = !!busy.video;
      }
    }

    // The settings panel, on a desktop in a call: the button at the bar's
    // right end opens it; Escape, a click anywhere else, or leaving the
    // call closes it.
    $('more').hidden = handheld;
    setIcon($('more'), 'more', 'Settings');
    $('more').setAttribute('aria-haspopup', 'dialog');
    $('more').setAttribute('aria-expanded', 'false');
    function openSettings() {
      $('settings').hidden = false;
      $('more').setAttribute('aria-expanded', 'true');
      wake();
    }
    function closeSettings() {
      $('settings').hidden = true;
      $('more').setAttribute('aria-expanded', 'false');
    }
    $('more').addEventListener('click', () => ($('settings').hidden ? openSettings() : closeSettings()));
    document.addEventListener('keydown', e => {
      if (e.key !== 'Escape' || $('settings').hidden) return;
      closeSettings();
      $('more').focus();
    });
    document.addEventListener('click', e => {
      if (!$('settings').hidden && !e.target.closest('.bar .end')) closeSettings();
    });

    // The microphone and the camera can be off before joining: the track is
    // muted, and the call publishes it muted. The track is the truth, as
    // with blur: a device is off while its track is muted. Muting the camera
    // stops the capture (its light goes out) and unmuting restarts it on the
    // same device, re-attached to the preview, blur and all.
    //
    // A button is absent with no track of its kind. It waits while a switch
    // is in flight (on or off, or to another device), from the Join click,
    // and, the camera's, while blur is switching, so one thing at a time
    // works on a track. A device's pickers wait while it is off: another
    // device would restart the capture behind the mute (drawDevices).
    const mediaSwitches = [['mic-preview', Track.Kind.Audio], ['cam-preview', Track.Kind.Video]];
    function drawMedia() {
      for (const [id, kind] of mediaSwitches) {
        const track = trackOfKind(kind), off = !!(track && track.isMuted);
        const button = $(id);
        button.hidden = !track;
        button.disabled = !!lobby.switching || lobby.joining || !!busy[kind] || (kind === Track.Kind.Video && !!blurBusy);
        drawSwitch(button, kind, !off);
      }
      $('preview').parentElement.classList.toggle('cam-off', !!(camTrack() && camTrack().isMuted));
      drawDevices();
    }
    async function switchMedia(kind) {
      const track = trackOfKind(kind);
      if (!track || lobby.switching || lobby.joining || busy[kind] || (kind === Track.Kind.Video && blurBusy)) return;
      // A camera that cannot start again (unplugged, taken by another app)
      // stays off and says why; the promise join() waits for never fails.
      lobby.switching = (track.isMuted ? track.unmute() : track.mute()).catch(showError);
      drawMedia();
      drawBlur();
      await lobby.switching;
      lobby.switching = null;
      drawMedia();
      drawBlur();
    }
    for (const [id, kind] of mediaSwitches) $(id).addEventListener('click', () => switchMedia(kind));

    async function pollPresence() {
      try {
        const res = await fetch(`/api/rooms/${roomId}`);
        if (!res.ok) return;
        const { participants } = await res.json();
        // A response that lands after the lobby was left, or after Join
        // was clicked, must not touch the button.
        if (!lobby.poll || lobby.joining) return;
        const n = participants.length;
        $('presence').textContent =
          n === 0 ? 'Nobody has joined yet.' :
          n === 1 ? `${nameOf(participants[0])} is already here.` : FULL;
        $('join').disabled = n >= 2;
      } catch (e) { /* the next poll tries again */ }
    }
    function startPolling() { stopPolling(); pollPresence(); lobby.poll = setInterval(pollPresence, 3000); }
    function stopPolling() { if (lobby.poll) clearInterval(lobby.poll); lobby.poll = null; }

    // ---- blur -----------------------------------------------------------

    // Background blur, one look, on or off, from the button on the preview
    // or the one in the controls: LiveKit's background processor on the
    // camera track, with its wasm and model served by the app
    // (LivekitTrackProcessors.assetBase). The track is the truth: blur is
    // on while the camera track has a processor. The processor goes where
    // the track goes, into the call and through a device switch or the
    // camera going off and on (the client restarts it with the track).
    //
    // The choice is remembered on this device, and a lobby restores it only
    // after fillDevices: with a processor on, the track's mediaStreamTrack
    // is the processed one, which has no deviceId to select. join() waits
    // for the lobby and for any switch in flight, so whoever asked for blur
    // is never published without it.
    const BLUR_KEY = 'quickmeet.blur';
    const BLUR_FAILED = 'Background blur is not available here.';
    const blurButtons = [$('blur-preview'), $('blur')];
    const camTrack = () => trackOfKind(Track.Kind.Video);
    const blurOn = () => { const t = camTrack(); return !!(t && t.getProcessor()); };
    const blurSupported = () => !!window.LivekitTrackProcessors && LivekitTrackProcessors.supportsBackgroundProcessors();
    Object.defineProperty(window.call, 'blur', { get: blurOn });
    // Storage can be refused (some private modes); blur then just is not
    // remembered.
    const remembered = () => { try { return localStorage.getItem(BLUR_KEY) === '1'; } catch (e) { return false; } };
    function remember(on) {
      try { on ? localStorage.setItem(BLUR_KEY, '1') : localStorage.removeItem(BLUR_KEY); } catch (e) { /* not remembered */ }
    }
    // The promise of the switch in flight, null when there is none.
    let blurBusy = null;

    // Both buttons show the same state; on is the solid one. With the camera
    // off there is nothing to blur, so the button waits; so it does from the
    // Join click until the call is up, when the camera is being published
    // and a switch started then could reach the other side half done.
    function drawBlur() {
      const track = camTrack(), on = blurOn();
      const publishing = lobby.joining && !window.call.joined;
      for (const button of blurButtons) {
        button.hidden = !track || !blurSupported();
        button.disabled = !!blurBusy || !!busy.video || !!lobby.switching || publishing || !!(track && track.isMuted);
        setIcon(button, 'blur', on ? 'Stop blurring' : 'Blur background');
        button.setAttribute('aria-pressed', String(on));
        button.toggleAttribute('data-on', on);
      }
    }

    // How strong the blur is, in pixels of a frame whose short side is 720
    // (the vendored library scales it to the frame; see
    // scripts/vendor-blur.patch). Soft shapes of the room stay, like a
    // camera's shallow focus, and nothing in it can be read. Stronger, the
    // room turns into a flat wash and the person looks cut out: a sharp bit
    // of background the segmenter took for hair stands out against it. The
    // patch, not the strength, is what keeps it from shimmering.
    const BLUR_RADIUS = 60;
    async function switchBlur(track, on) {
      if (!on) return track.stopProcessor();
      const base = location.origin + LivekitTrackProcessors.assetBase;
      await track.setProcessor(LivekitTrackProcessors.BackgroundProcessor({
        mode: 'background-blur',
        blurRadius: BLUR_RADIUS,
        assetPaths: { tasksVisionFileSet: base, modelAssetPath: base + '/selfie_segmenter.tflite' },
      }));
    }

    // Turns blur on or off; resolves to whether it is now as asked. When it
    // cannot start (the wasm did not load, WebGL refused), the camera goes
    // on unblurred, the choice is forgotten and the person is told. If the
    // lobby started over meanwhile, the camera this was for is gone: the
    // client attaches a processor only once it is ready, so stopping the
    // track did not stop it, and it is taken off here.
    async function setBlur(on) {
      const track = camTrack();
      if (!track || !blurSupported() || blurBusy) return false;
      if (on === blurOn()) return true;
      blurBusy = (async () => {
        let ok = true;
        try { await switchBlur(track, on); } catch (e) { ok = false; }
        if (ok && track === camTrack()) return 'done';
        await track.stopProcessor().catch(() => {});
        return track === camTrack() ? 'failed' : 'gone';
      })();
      drawBlur();
      drawMedia();
      const result = await blurBusy;
      blurBusy = null;
      if (result === 'failed') { remember(false); blurFailed(); }
      drawBlur();
      drawMedia();
      return result === 'done';
    }
    function blurFailed() {
      if (!window.call.joined) { showNotice(BLUR_FAILED); return; }
      flash(BLUR_FAILED);
    }

    // A switch still running for the previous lobby's camera ends first.
    async function restoreBlur() {
      while (blurBusy) await blurBusy;
      drawBlur();
      if (remembered()) await setBlur(true);
    }
    for (const button of blurButtons) {
      button.addEventListener('click', async () => {
        const on = !blurOn();
        if (await setBlur(on)) remember(on);
      });
    }

    // ---- ringing --------------------------------------------------------

    // While alone, a signed-in person can ring the room's other members on
    // the devices they turned ringing on for; the token response says who
    // that would reach. One ring, then the button rests for as long as the
    // server would refuse another (30 s); a refusal for that reason reads
    // as rung too. The notification opens this room's lobby on their side.
    const RING_REST_MS = 30_000;
    let ringRest = null;
    function drawRing() {
      const names = window.call.ring;
      const resting = !!ringRest;
      $('ring').hidden = names.length === 0;
      $('ring').disabled = resting;
      const label = document.createElement('span');
      label.textContent = resting ? 'Rung' : names.length === 1 ? 'Ring ' + names[0] : 'Ring them';
      $('ring').innerHTML = icon('bell');
      $('ring').append(label);
      // One green button at a time: with Ring there, the link steps back.
      $('invite').classList.toggle('primary', names.length === 0);
    }
    function resetRing() {
      clearTimeout(ringRest);
      ringRest = null;
      drawRing();
    }
    $('ring').addEventListener('click', async () => {
      $('ring').disabled = true;
      let res = null;
      try { res = await fetch(`/api/rooms/${roomId}/ring`, { method: 'POST' }); } catch (e) { /* offline */ }
      if (res && (res.ok || res.status === 429)) {
        ringRest = setTimeout(resetRing, RING_REST_MS);
        drawRing();
        return;
      }
      drawRing();
      // Said only while still alone: someone may have arrived, or the
      // connection dropped, while the request was out.
      const room = window.call.room;
      const alone = room && room.remoteParticipants.size === 0 && !document.body.classList.contains('reconnecting');
      if (!alone) return;
      setStatus(RING_FAILED, true);
      setTimeout(() => {
        if (window.call.room && $('status').textContent === RING_FAILED) refreshStatus(window.call.room);
      }, 4000);
    });

    // ---- screen sharing -------------------------------------------------

    // The browser's own picker chooses what is shared, a monitor, a window
    // or a tab; the page only asks it to open on the whole screen. Phones
    // cannot share: iPhone browsers have no getDisplayMedia, and Android's
    // have one that refuses every call, so the device decides, not the
    // window's size. The track is the truth, as with blur: we are sharing
    // while a screen track is published. The browser's own "Stop sharing"
    // ends that track, the client unpublishes it, and the button follows
    // (LocalTrackUnpublished, in join()).
    const SHARING = 'You are sharing your screen.';
    const SHARE_FAILED = 'Screen sharing is not available here.';
    const canShare = !!(navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia) && !handheld;
    const sharing = () => !!(window.call.room && window.call.room.localParticipant.isScreenShareEnabled);
    Object.defineProperty(window.call, 'sharing', { get: sharing });
    // Set while the picker is open, so a second click cannot start a
    // second capture.
    let shareBusy = false;

    function drawShare() {
      const on = sharing();
      $('share').hidden = !canShare;
      $('share').disabled = shareBusy;
      setIcon($('share'), 'screen', on ? 'Stop sharing' : 'Share screen');
      $('share').setAttribute('aria-pressed', String(on));
      $('share').toggleAttribute('data-on', on);
    }

    // Closing the picker rejects with NotAllowedError: a decision, not a
    // failure, so nothing is said.
    async function toggleShare(room) {
      if (shareBusy) return;
      shareBusy = true;
      drawShare();
      try {
        await room.localParticipant.setScreenShareEnabled(!sharing(), { audio: false, video: { displaySurface: 'monitor' } });
      } catch (e) {
        if (e.name !== 'NotAllowedError') shareFailed();
      }
      shareBusy = false;
      drawShare();
    }
    function shareFailed() { flash(SHARE_FAILED); }

    // ---- call -----------------------------------------------------------

    // Presence drives the banner, not media: a receive-only participant
    // publishes nothing, and is still someone to talk to. With someone here,
    // the line says whether we are sharing, which also keeps the controls
    // (and the way to stop) from fading.
    function refreshStatus(room) {
      const alone = room.remoteParticipants.size === 0;
      setStatus(alone ? WAITING : sharing() ? SHARING : null, alone);
    }
    // The other person is here: their name goes in the bar, the clock runs.
    function arrived(participant) {
      $('remote-name').textContent = nameOf(participant);
      startClock();
    }
    // The buttons show what the microphone and camera are doing now, in
    // the lobby and in the call; off is the solid one. With the camera off
    // there is no self view to show.
    function drawSwitch(button, kind, on) {
      const [name, label] = kind === Track.Kind.Audio
        ? (on ? ['mic', 'Mute'] : ['mic-off', 'Unmute'])
        : (on ? ['video', 'Stop video'] : ['video-off', 'Start video']);
      setIcon(button, name, label);
      button.toggleAttribute('data-off', !on);
    }
    function showMic(on) {
      drawSwitch($('mic'), Track.Kind.Audio, on);
      drawDevices();
    }
    function showCam(on) {
      drawSwitch($('cam'), Track.Kind.Video, on);
      $('local').parentElement.hidden = !on;
      drawBlur();
      drawDevices();
    }

    // Two people can both get tokens before the room fills; the SFU then
    // refuses one with an error the browser cannot tell from a broken
    // connection (see sfu.lg). So a failed connect asks the app again.
    async function isFull() {
      try {
        const res = await fetch(`/api/rooms/${roomId}`);
        if (!res.ok) return false;
        return (await res.json()).participants.length >= 2;
      } catch (e) { return false; }
    }

    async function join() {
      if (lobby.joining) return;
      lobby.joining = true;
      stopPolling();
      $('join').disabled = true;
      $('error').hidden = true;
      drawBlur();
      drawMedia();
      try {
        await lobby.ready;
        await lobby.switching;
        await busy.video;
        await busy.audio;
        await blurBusy;
        const res = await fetch(`/api/rooms/${roomId}/token`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identity: $('identity').value }),
        });
        if (res.status === 409) throw new Error(FULL);
        if (!res.ok) throw new Error('could not get a token (' + res.status + ')');
        const { token, url, ring } = await res.json();
        window.call.ring = ring || [];
        drawRing();

        const room = new Room({ adaptiveStream: true, dynacast: true });
        window.call.room = room;
        room.on(RoomEvent.TrackSubscribed, (track, pub, participant) => {
          if (track.kind === Track.Kind.Video) { remoteVideo[remoteSlot(pub)] = track; showRemote(); }
          if (track.kind === Track.Kind.Audio) { track.attach(); window.call.tracks.audio = track; }
          arrived(participant);
          window.call.remote = nameOf(participant);
        });
        // A share that ends arrives here: the stage goes back to the camera.
        room.on(RoomEvent.TrackUnsubscribed, (track, pub) => {
          const slot = remoteSlot(pub);
          if (track.kind !== Track.Kind.Video || remoteVideo[slot] !== track) return;
          remoteVideo[slot] = null;
          showRemote();
        });
        room.on(RoomEvent.ParticipantConnected, participant => { arrived(participant); refreshStatus(room); });
        room.on(RoomEvent.ParticipantDisconnected, () => {
          $('remote-name').textContent = 'the other side left';
          // The element can keep the last frame's size after the track
          // ends, so the reset does not ask it.
          clearRemote();
          stopClock();
          window.call.remote = null;
          window.call.tracks = { video: null, audio: null };
          setStatus(WAITING, true);
        });
        // A dropped signalling socket raises SignalReconnecting first and
        // Reconnecting only if a full reconnect follows; both are one state.
        const reconnecting = () => { document.body.classList.add('reconnecting'); setStatus('Reconnecting…'); };
        room.on(RoomEvent.SignalReconnecting, reconnecting);
        room.on(RoomEvent.Reconnecting, reconnecting);
        room.on(RoomEvent.Reconnected, () => { document.body.classList.remove('reconnecting'); refreshStatus(room); });
        // Our screen track came or went, by the button or by the browser.
        const shareChanged = pub => {
          if (pub.source !== Track.Source.ScreenShare) return;
          drawShare();
          refreshStatus(room);
        };
        room.on(RoomEvent.LocalTrackPublished, shareChanged);
        room.on(RoomEvent.LocalTrackUnpublished, shareChanged);
        room.on(RoomEvent.AudioPlaybackStatusChanged, () => { $('sound').hidden = room.canPlaybackAudio; });
        room.on(RoomEvent.Disconnected, reason => {
          // A failed join tears itself down in join()'s catch; only a call
          // that was up returns to the lobby from here.
          if (!window.call.joined) return;
          window.call.joined = false;
          clearRemote();
          window.call.tracks = { video: null, audio: null };
          stopClock();
          document.body.classList.remove('reconnecting');
          show('lobby');
          startLobby(reason === DisconnectReason.CLIENT_INITIATED ? null : 'Connection lost. Join again.');
        });

        try {
          await room.connect(url, token);
        } catch (e) {
          throw (await isFull()) ? new Error(FULL) : e;
        }
        for (const t of lobby.tracks) {
          await room.localParticipant.publishTrack(t);
          if (t.kind === Track.Kind.Video) t.attach($('local'));
        }
        window.call.joined = true;
        showMic(room.localParticipant.isMicrophoneEnabled);
        showCam(room.localParticipant.isCameraEnabled);
        drawShare();
        // Someone who was here first raises no ParticipantConnected.
        for (const p of room.remoteParticipants.values()) arrived(p);
        refreshStatus(room);
        $('sound').hidden = room.canPlaybackAudio;
        $('sound').onclick = async () => {
          await room.startAudio();
          $('sound').hidden = room.canPlaybackAudio;
        };
        show('call');

        $('mic').onclick = async () => {
          if (busy.audio) return;
          const on = !room.localParticipant.isMicrophoneEnabled;
          await room.localParticipant.setMicrophoneEnabled(on);
          showMic(on);
        };
        $('cam').onclick = async () => {
          if (busy.video) return;
          const on = !room.localParticipant.isCameraEnabled;
          await room.localParticipant.setCameraEnabled(on);
          showCam(on);
        };
        $('share').onclick = () => toggleShare(room);
        $('leave').onclick = () => room.disconnect();
      } catch (e) {
        // Whatever got as far as connecting is torn down, then the lobby
        // starts over with the error on show.
        const room = window.call.room;
        window.call.room = null;
        if (room) await room.disconnect().catch(() => {});
        show('lobby');
        startLobby();
        showError(e);
      }
    }
    $('join').addEventListener('click', join);

    loadRoom();
  </script>
</body>
</html>
