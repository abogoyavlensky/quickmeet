<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f5f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111312" media="(prefers-color-scheme: dark)">
  <title data-i18n>Sign in · quickmeet</title>
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="stylesheet" href="/static/fonts.css">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/i18n.js"></script>
  <script defer src="https://pagelet.absky.dev/p.js"></script>
</head>
<body>
  <header class="bar"><a class="brand" href="/">quickmeet</a></header>
  <main class="page">
    <h1 data-i18n>Sign in</h1>
    <p class="lead" data-i18n>Sign in to start a call.</p>
    <form id="form" class="form">
      <label><span data-i18n>Email</span> <input id="email" type="email" autocomplete="email" required autofocus></label>
      <label><span data-i18n>Password</span> <input id="password" type="password" autocomplete="current-password" required></label>
      <button id="submit" class="primary" type="submit" data-i18n>Sign in</button>
      <p id="error" class="error" hidden></p>
    </form>
    <p class="muted"><span data-i18n>No account yet?</span> <a href="/signup" data-i18n>Sign up</a></p>
  </main>
  <script src="/static/account.js"></script>
  <script>
    // The API's codes, and the sentences it sends ready-made, in the
    // page's language.
    accountForm('/api/auth/signin', {
      'invalid email or password': t('Invalid email or password.'),
      'not allowed': t('This address is not allowed on this instance.'),
      'Too many attempts. Try again later.': t('Too many attempts. Try again later.'),
    });
  </script>
</body>
</html>
