<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · quickmeet</title>
  <link rel="icon" href="/static/icon.svg">
  <link rel="stylesheet" href="/static/fonts.css">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="bar"><a class="brand" href="/">quickmeet</a></header>
  <main class="page">
    <h1>Sign in</h1>
    <p class="lead">Sign in to start a call.</p>
    <form id="form" class="form">
      <label>Email <input id="email" type="email" autocomplete="email" required autofocus></label>
      <label>Password <input id="password" type="password" autocomplete="current-password" required></label>
      <button id="submit" class="primary" type="submit">Sign in</button>
      <p id="error" class="error" hidden></p>
    </form>
    <p class="muted">No account yet? <a href="/signup">Sign up</a></p>
  </main>
  <script src="/static/account.js"></script>
  <script>
    accountForm('/api/auth/signin', {
      'invalid email or password': 'Invalid email or password.',
      'not allowed': 'This address is not allowed on this instance.',
    });
  </script>
</body>
</html>
