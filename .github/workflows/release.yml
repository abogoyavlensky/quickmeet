name: release

# A version tag (v0.1.0) publishes a GitHub release with a linux/amd64
# tarball: the binary, the files docs/INSTALL.md installs, and the guide.
# No container image and no macOS build; see docs/ROADMAP.md.
on:
  push:
    tags: ["v*"]

# Static, like the staging image: the tarball must run on any linux/amd64
# distribution, not only on one with the runner's glibc. See .mise.toml.
env:
  CGO_ENABLED: "0"

jobs:
  # A release is never cut from a commit the tests have not passed on.
  test:
    uses: ./.github/workflows/test.yml

  release:
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # lgx and Go at the versions in .mise.toml.
      - uses: jdx/mise-action@v3

      # Same runtime cache as test.yml and deploy.yml: the build is a hit.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.lgx/runtimes
          key: runtimes-static-${{ runner.os }}-${{ hashFiles('lgx.edn') }}
          restore-keys: runtimes-static-${{ runner.os }}-

      - name: Build the binary
        run: |
          lgx build
          file bin/quickmeet | grep -q 'statically linked'

      - name: Package
        run: |
          name="quickmeet-${GITHUB_REF_NAME}-linux-amd64"
          mkdir "$name"
          cp bin/quickmeet deploy/quickmeet.service deploy/Caddyfile \
             deploy/quickmeet.env.example docs/INSTALL.md "$name/"
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          echo "NAME=$name" >> "$GITHUB_ENV"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes "$NAME.tar.gz" "$NAME.tar.gz.sha256"
