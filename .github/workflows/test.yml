name: test

# Master pushes run these tests through deploy.yml, which deploys after them.
on:
  push:
    branches-ignore: [master]
  pull_request:
  workflow_call:

# A static binary, so the one the tests run is the one the container image
# ships; see .mise.toml.
env:
  CGO_ENABLED: "0"

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # lgx, Go and Node at the versions in .mise.toml.
      - uses: jdx/mise-action@v3

      # The app runs on a custom lg that lgx builds with the Go toolchain
      # (:lg-runtime :built). The build is keyed on lgx.edn and the Go shim
      # in webpush/, so a run that changes neither reuses the cached runtime. "static"
      # in the key: lgx keys runtimes on CGO_ENABLED too, and an exact key hit
      # never saves, so the old key would never cache the static runtime.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.lgx/runtimes
          key: runtimes-static-${{ runner.os }}-${{ hashFiles('lgx.edn', 'webpush/**') }}
          restore-keys: runtimes-static-${{ runner.os }}-

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      - name: Unit tests
        run: lgx test

      - name: Install the browser tests
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium-headless-shell

      # Builds bin/quickmeet, then Playwright starts it on test ports and
      # drives two headless Chromiums through a real call. The SFU's UDP
      # range is local to the runner; nothing to open.
      - name: Browser tests
        run: lgx e2e

      # The image around the binary the browser tests just ran, started
      # with its own defaults and asked for a page.
      - name: Smoke-test the image
        run: scripts/docker-smoke.sh

      # deploy/docker as a user runs it, Caddy in front, on that image.
      - name: Run the Docker Compose setup
        run: scripts/docker-compose-smoke.sh

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
